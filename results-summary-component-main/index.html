<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <title>DEO ORIGINAL! </title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="outer-container">
    <div class="left-side">
      <h4>Your Result</h4>
      <h1>76</h1>
      <h2>Great</h2>
      <p>You scored higher than 65% of the people who has taken these tests.</p>
    </div>

    <div class="right-side">
      <h3>Summary</h3>
      <div class="first">
        <img src="assets/images/icon-reaction.svg" alt="">
        <h4>Reaction</h4>
        <h3>80/100</h3>
      </div>


      <div class="second">
        <img src="assets/images/icon-memory.svg" alt="">
        <h4>Memory</h4>
        <h3>92/100</h3>
      </div>    
      
      

      <div class="third">
        <img src="assets/images/icon-verbal.svg" alt="">
        <h4>Verbal</h4>
        <h3>61/100</h3>
      </div>  





      <div class="forth">
        <img src="assets/images/icon-visual.svg" alt="">
        <h4>Visual</h4>
        <h3>73/100</h3>
      </div>  



      
      <div class="btn">
        <button>Continue</button>
      </div>
    </div>
  </div>

</body>
</html>
